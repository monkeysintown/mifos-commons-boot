plugins {
    id "org.mifos.conventions.gradle.base.java"
}

description = "Mifos Initiative - Commons - Boot - CLI - Tamboui"

dependencies {
    implementation project(":mifos-commons-boot-core")
    api "org.springframework.boot:spring-boot-starter"

    annotationProcessor "dev.tamboui:tamboui-processor"
    implementation "dev.tamboui:tamboui-toolkit"
    implementation "dev.tamboui:tamboui-css"
    implementation "dev.tamboui:tamboui-image"
}
